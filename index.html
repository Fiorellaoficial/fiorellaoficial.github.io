<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fiorella - Login</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3e8f6;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Card Principal de Login -->
    <div class="bg-white w-full max-w-md rounded-[32px] shadow-lg overflow-hidden border border-gray-100 flex flex-col">
        
        <!-- Topo do Card com a Logo do GitHub -->
        <div class="bg-[#e5e5e5] py-6 px-6 flex justify-center items-center rounded-t-[32px]">
            <div class="bg-[#e5e5e5] px-6 py-2 rounded-xl shadow-sm border border-gray-200 flex items-center justify-center">
                <img src="https://raw.githubusercontent.com/Fiorellaoficial/fiorellaoficial.github.io/6904bc82debaf20fc8f58a69440f22d31a30516f/logo.png" alt="Logo Fiorella" class="h-8 w-auto object-contain">
            </div>
        </div>

        <!-- Conteúdo do Formulário -->
        <div class="p-6 sm:p-8 flex flex-col gap-6">
            
            <h2 class="text-2xl font-bold text-center text-gray-800 tracking-tight">Login</h2>

            <form class="flex flex-col gap-4" onsubmit="event.preventDefault(); alert('Login efetuado com sucesso!');">
                
                <!-- Campo E-mail -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs sm:text-sm text-gray-700 font-medium">informe o seu e-mail:</label>
                    <input 
                        type="email" 
                        placeholder="ex: example@gmail.com" 
                        required
                        class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-700 placeholder-gray-400 focus:outline-none focus:ring-1 focus:ring-[#7d487b]"
                    >
                </div>

                <!-- Campo Senha -->
                <div class="flex flex-col gap-1.5">
                    <label class="text-xs sm:text-sm text-gray-700 font-medium">informe a sua senha:</label>
                    <input 
                        type="password" 
                        required
                        class="w-full bg-white border border-gray-300 rounded-md px-3 py-2 text-sm text-gray-700 focus:outline-none focus:ring-1 focus:ring-[#7d487b]"
                    >
                    <div class="text-right">
                        <a href="#" onclick="alert('Recuperação de senha'); return false;" class="text-xs text-[#0066cc] hover:underline">Esqueci minha senha</a>
                    </div>
                </div>

                <!-- Botão de Entrar -->
                <button type="submit" class="mt-2 w-full bg-[#7d487b] hover:bg-[#683b66] text-white font-medium py-2.5 rounded-full shadow transition text-sm cursor-pointer">
                    Entrar
                </button>
            </form>

            <!-- Divisor OU -->
            <div class="flex items-center my-1">
                <div class="flex-1 border-t border-gray-200"></div>
                <span class="px-3 text-xs text-gray-400 font-medium tracking-widest">OU</span>
                <div class="flex-1 border-t border-gray-200"></div>
            </div>

            <!-- Botão Continuar com o Google -->
            <button onclick="alert('Redirecionando para login com Google...');" class="w-full bg-white border border-gray-300 hover:bg-gray-50 text-gray-700 font-medium py-2.5 px-4 rounded-full shadow-sm flex items-center justify-center gap-2 transition text-sm cursor-pointer">
                <svg class="w-4 h-4" viewBox="0 0 24 24">
                    <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
                    <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.95H1.2v3.14C3.2 21.36 7.23 24 12 24z"/>
                    <path fill="#FBBC05" d="M5.28 14.25c-.25-.72-.38-1.49-.38-2.25s.13-1.53.38-2.25V6.61H1.2C.43 8.15 0 9.89 0 12s.43 3.85 1.2 5.39l4.08-3.14z"/>
                    <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.23 0 3.2 2.64 1.2 6.61l4.08 3.14c.95-2.84 3.6-4.95 6.72-4.95z"/>
                </svg>
                <span>Continuar com o Google</span>
            </button>

        </div>
    </div>

</body>
</html>
