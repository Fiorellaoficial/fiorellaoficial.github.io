<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loja de Temperos e Produtos</title>
    <!-- Tailwind CSS para estilização rápida e responsiva -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #d2e4ea; /* Tom de azul claro idêntico ao da imagem */
        }
    </style>
</head>
<body class="min-h-screen flex justify-center items-start py-0 md:py-6">

    <!-- Container simulando a tela de um smartphone -->
    <div class="w-full max-w-md min-h-screen md:min-h-[850px] bg-[#d2e4ea] md:rounded-[40px] md:shadow-2xl overflow-hidden flex flex-col relative">

        <!-- Barra de Topo Roxa -->
        <header class="bg-[#7d487b] px-4 pt-6 pb-6 rounded-b-[28px] shadow-md flex items-center justify-between gap-3">
            <!-- Botão Menu Hambúrguer -->
            <button class="w-12 h-12 bg-white rounded-full flex items-center justify-center text-[#7d487b] shadow-inner focus:outline-none hover:bg-gray-100 transition">
                <i class="fa-solid fa-bars text-xl"></i>
            </button>

            <!-- Barra de Pesquisa -->
            <div class="flex-1 relative flex items-center">
                <input 
                    type="text" 
                    placeholder="Pesquisar" 
                    class="w-full bg-white text-gray-700 placeholder-gray-400 text-base py-3 pl-4 pr-12 rounded-full focus:outline-none shadow-inner"
                >
                <button class="absolute right-4 text-gray-500 focus:outline-none">
                    <i class="fa-solid fa-magnifying-glass text-lg"></i>
                </button>
            </div>
        </header>

        <!-- Lista de Produtos -->
        <main class="flex-1 px-4 py-6 flex flex-col gap-4 overflow-y-auto">

            <!-- Cartão 1: Alho picado -->
            <div class="bg-[#b4f3cd] rounded-[24px] p-4 shadow-sm flex items-center justify-between relative">
                <!-- Imagem do Produto -->
                <div class="w-20 h-20 rounded-[18px] overflow-hidden flex-shrink-0 bg-white shadow-sm">
                    <img 
                        src="https://images.unsplash.com/photo-1540189549336-e6e99c3679fe?auto=format&fit=crop&w=200&q=80" 
                        alt="Alho picado" 
                        class="w-full h-full object-cover"
                        onerror="this.src='https://placehold.co/200x200/ffffff/7d487b?text=Alho'"
                    >
                </div>

                <!-- Detalhes do Produto -->
                <div class="flex-1 ml-3 flex flex-col justify-center">
                    <h2 class="text-gray-800 font-semibold text-lg leading-tight">Alho picado</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-gray-800 font-medium text-sm">R$2,5</span>
                        <span class="bg-[#528a6c] text-white text-xs font-semibold px-2.5 py-0.5 rounded-full shadow-sm">+3g</span>
                    </div>
                </div>

                <!-- Ações (Botões) -->
                <div class="flex flex-col items-end gap-2">
                    <!-- Botão Adicionar ao Carrinho -->
                    <button class="bg-white hover:bg-gray-50 text-gray-800 font-medium px-3.5 py-1.5 rounded-full shadow-sm flex items-center gap-1.5 text-sm transition">
                        <span>+</span>
                        <i class="fa-solid fa-cart-shopping text-xs"></i>
                    </button>
                    <!-- Botão Ver Mais -->
                    <button class="bg-[#528a6c] hover:bg-[#437258] text-white text-xs font-medium px-3.5 py-1.5 rounded-full shadow-sm transition">
                        ver mais
                    </button>
                </div>
            </div>

            <!-- Cartão 2: Produto 2 -->
            <div class="bg-[#b4f3cd] rounded-[24px] p-4 shadow-sm flex items-center justify-between relative">
                <!-- Imagem do Produto -->
                <div class="w-20 h-20 rounded-[18px] overflow-hidden flex-shrink-0 bg-white shadow-sm">
                    <img 
                        src="https://images.unsplash.com/photo-1596040033229-a9821ebd058d?auto=format&fit=crop&w=200&q=80" 
                        alt="Produto 2" 
                        class="w-full h-full object-cover"
                        onerror="this.src='https://placehold.co/200x200/ffffff/7d487b?text=Prod+2'"
                    >
                </div>

                <!-- Detalhes do Produto -->
                <div class="flex-1 ml-3 flex flex-col justify-center">
                    <h2 class="text-gray-800 font-semibold text-lg leading-tight">Produto 2</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-gray-800 font-medium text-sm">R$---</span>
                        <span class="bg-[#528a6c] text-white text-xs font-semibold px-2.5 py-0.5 rounded-full shadow-sm">+3g</span>
                    </div>
                </div>

                <!-- Ações (Botões) -->
                <div class="flex flex-col items-end gap-2">
                    <!-- Botão Adicionar ao Carrinho -->
                    <button class="bg-white hover:bg-gray-50 text-gray-800 font-medium px-3.5 py-1.5 rounded-full shadow-sm flex items-center gap-1.5 text-sm transition">
                        <span>+</span>
                        <i class="fa-solid fa-cart-shopping text-xs"></i>
                    </button>
                    <!-- Botão Ver Mais -->
                    <button class="bg-[#528a6c] hover:bg-[#437258] text-white text-xs font-medium px-3.5 py-1.5 rounded-full shadow-sm transition">
                        ver mais
                    </button>
                </div>
            </div>

            <!-- Cartão 3: Produto 3 -->
            <div class="bg-[#b4f3cd] rounded-[24px] p-4 shadow-sm flex items-center justify-between relative">
                <!-- Imagem do Produto -->
                <div class="w-20 h-20 rounded-[18px] overflow-hidden flex-shrink-0 bg-white shadow-sm">
                    <img 
                        src="https://images.unsplash.com/photo-1615485290382-441e4d049cb5?auto=format&fit=crop&w=200&q=80" 
                        alt="Produto 3" 
                        class="w-full h-full object-cover"
                        onerror="this.src='https://placehold.co/200x200/ffffff/7d487b?text=Prod+3'"
                    >
                </div>

                <!-- Detalhes do Produto -->
                <div class="flex-1 ml-3 flex flex-col justify-center">
                    <h2 class="text-gray-800 font-semibold text-lg leading-tight">Produto 3</h2>
                    <div class="flex items-center gap-2 mt-1">
                        <span class="text-gray-800 font-medium text-sm">R$---</span>
                        <span class="bg-[#528a6c] text-white text-xs font-semibold px-2.5 py-0.5 rounded-full shadow-sm">+3g</span>
                    </div>
                </div>

                <!-- Ações (Botões) -->
                <div class="flex flex-col items-end gap-2">
                    <!-- Botão Adicionar ao Carrinho -->
                    <button class="bg-white hover:bg-gray-50 text-gray-800 font-medium px-3.5 py-1.5 rounded-full shadow-sm flex items-center gap-1.5 text-sm transition">
                        <span>+</span>
                        <i class="fa-solid fa-cart-shopping text-xs"></i>
                    </button>
                    <!-- Botão Ver Mais -->
                    <button class="bg-[#528a6c] hover:bg-[#437258] text-white text-xs font-medium px-3.5 py-1.5 rounded-full shadow-sm transition">
                        ver mais
                    </button>
                </div>
            </div>

        </main>
    </div>

</body>
</html>
